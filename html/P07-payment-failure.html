<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>پرداخت ناموفق - نوبتینو</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		:root {
			--primary: #3262CE;
			--primary-light: #E7F0FB;
			--dark: #111B30;
			--text-primary: #111827;
			--text-secondary: #526174;
			--card-bg: #FAFDFE;
			--border: #DCE6EB;
			--error: #DC2626;
			--error-bg: #FCE9EE;
			--error-text: #B91C1C;
			--white: #FFFFFF;
			--shadow: 0 4px 16px rgba(17, 27, 48, 0.05);
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: linear-gradient(180deg, #DCEBFC 0%, #E5F5F0 100%);
			background-attachment: fixed;
			min-height: 100vh;
			color: var(--text-primary);
			font-family: 'Vazirmatn', system-ui, sans-serif;
			font-size: 16px;
			line-height: 1.6;
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 0 20px;
		}

		.page-content {
			padding: 32px 0 48px;
			display: flex;
			justify-content: center;
		}

		.result-card {
			width: 100%;
			max-width: 480px;
			background: var(--card-bg);
			border: 1px solid var(--border);
			border-radius: 24px;
			box-shadow: var(--shadow);
			padding: 32px 24px;
			text-align: center;
		}

		.result-icon {
			width: 88px;
			height: 88px;
			margin: 0 auto 20px;
			border-radius: 50%;
			background: var(--error-bg);
			color: var(--error);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 40px;
		}

		.result-card h1 {
			font-size: 24px;
			font-weight: 700;
			color: var(--text-primary);
			margin-bottom: 8px;
		}

		.result-card > p {
			font-size: 15px;
			color: var(--text-secondary);
			margin-bottom: 24px;
		}

		.receipt {
			background: var(--error-bg);
			border-radius: 20px;
			padding: 16px;
			text-align: right;
			margin-bottom: 24px;
		}

		.receipt-row {
			display: flex;
			justify-content: space-between;
			gap: 16px;
			padding: 6px 0;
			font-size: 15px;
			color: var(--error-text);
		}

		.receipt-row strong {
			color: var(--text-primary);
			font-weight: 600;
		}

		.result-actions {
			display: grid;
			gap: 12px;
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			min-height: 48px;
			padding: 0 20px;
			border-radius: 999px;
			border: none;
			cursor: pointer;
			font-family: inherit;
			font-size: 15px;
			font-weight: 600;
			text-decoration: none;
			transition: background-color 0.2s;
		}

		.btn:hover { text-decoration: none; }

		.btn-primary {
			background: var(--primary);
			color: var(--white);
		}

		.btn-primary:hover { background: #2654B8; }

		.btn-secondary {
			background: transparent;
			border: 1.5px solid var(--primary);
			color: var(--primary);
		}

		.btn-secondary:hover { background: var(--primary-light); }

		.auto-return {
			margin-top: 16px;
			font-size: 14px;
			color: var(--text-secondary);
			min-height: 24px;
		}

		[hidden] { display: none !important; }

		@media (max-width: 480px) {
			.container { padding: 0 16px; }
			.page-content { padding: 24px 0 32px; }
			.result-card { padding: 24px 20px; border-radius: 20px; }
		}

		@media (prefers-reduced-motion: reduce) {
			* { transition: none !important; }
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
		}
	</style>
</head>
<body>
	<header></header>

	<main class="container page-content">
		<section class="result-card" aria-labelledby="resultTitle">
			<div class="result-icon"><i class="fas fa-circle-xmark" aria-hidden="true"></i></div>
			<h1 id="resultTitle">پرداخت انجام نشد</h1>
			<p id="resultMessage">تراکنش توسط درگاه رد شد. مبلغی از حساب شما کسر نشده و نوبت ثبت نشده است.</p>

			<div class="receipt">
				<div class="receipt-row"><span>پزشک:</span><strong id="receiptDoctor">—</strong></div>
				<div class="receipt-row"><span>زمان ویزیت:</span><strong id="receiptTime">—</strong></div>
				<div class="receipt-row"><span>شمارهٔ رزرو:</span><strong id="receiptReservation">—</strong></div>
			</div>

			<div class="result-actions">
				<a class="btn btn-primary" id="retryLink" href="P07-payment-gateway.html">
					<i class="fas fa-rotate-right" aria-hidden="true"></i> تلاش دوباره برای رزرو و پرداخت
				</a>
				<a class="btn btn-secondary" id="doctorLink" href="P02-doctor-details.html">
					انتخاب زمان دیگری برای نوبت
				</a>
				<a class="btn btn-secondary" href="P01-landing.html">بازگشت به صفحهٔ اصلی</a>
			</div>
			<p class="auto-return" id="autoReturn" aria-live="polite"></p>
		</section>
	</main>

	<script src="../js/doctors-data.js"></script>
	<script src="../js/reservation-system.js"></script>
	<script src="../js/payment-flow.js"></script>
	<script>
		(function () {
			const { reservation, demo } = PaymentFlow.getReservation();
			const retry = document.getElementById('retryLink');
			const doctor = document.getElementById('doctorLink');
			doctor.href = PaymentFlow.doctorUrl(reservation);

			if (demo) {
				PaymentFlow.fill('resultMessage', 'پرداخت آزمایشی ناموفق بود و نوبتی ثبت نشده است.');
				PaymentFlow.fillReceipt('receipt', null);
				PaymentFlow.fill('doctorLink', 'جست‌وجوی پزشکان');
				return;
			}
			if (!reservation) {
				PaymentFlow.fill('resultMessage', 'رزرو پیدا نشد. برای رزرو، زمان تازه‌ای انتخاب کنید.');
				PaymentFlow.fill('doctorLink', 'جست‌وجوی پزشکان');
				document.querySelector('.receipt').hidden = true;
				retry.hidden = true;
				return;
			}
			if (reservation.status === ReservationSystem.STATES.CONFIRMED) {
				location.replace(PaymentFlow.url(PaymentFlow.SUCCESS, reservation));
				return;
			}

			PaymentFlow.fillReceipt('receipt', reservation);
			const reason = new URLSearchParams(location.search).get('reason');
			if (reason === 'expired' || reservation.status === ReservationSystem.STATES.EXPIRED) {
				PaymentFlow.fill('resultMessage', 'مهلت نگهداری نوبت تمام شد. لطفاً زمان ویزیت را دوباره انتخاب کنید.');
			} else if (reason === 'unavailable') {
				PaymentFlow.fill('resultMessage', 'این رزرو دیگر قابل پرداخت نیست. لطفاً زمان ویزیت را دوباره انتخاب کنید.');
			}
			if (reservation.visitDate) retry.href = PaymentFlow.doctorUrl(reservation, true);
			else retry.hidden = true;

			PaymentFlow.autoReturn(doctor.href, 10);
		})();
	</script>
</body>
</html>
